<svg xmlns="http://www.w3.org/2000/svg" viewBox="59 84 282 42" preserveAspectRatio="none">
  <!-- Middle bun in the classic golden style -->
  <path d="M60 95
           Q60 85 80 85
           L320 85
           Q340 85 340 95
           L340 115
           Q340 125 320 125
           L80 125
           Q60 125 60 115
           Z"
        fill="#D4953A" stroke="#B87830" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Bun top highlight -->
  <path d="M90 95 Q200 88 310 95"
        fill="none" stroke="#E8B05A" stroke-width="3" opacity="0.55" stroke-linecap="round"/>

  <!-- Soft specular highlight -->
