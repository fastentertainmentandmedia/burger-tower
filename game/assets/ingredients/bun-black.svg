<svg xmlns="http://www.w3.org/2000/svg" viewBox="58 83 284 44" preserveAspectRatio="none">
  <!-- Bottom bun (charcoal / cuttlefish ink style) - flat base with rounded edges -->
  <path d="M60 95
           Q60 85 80 85
           L320 85
           Q340 85 340 95
           Q340 120 310 125
           L90 125
           Q60 120 60 95
           Z"
        fill="#1A1A1A" stroke="#000000" stroke-width="2.5"/>

  <!-- Bun top highlight (warm dark gray) -->
  <path d="M90 95 Q200 88 310 95"
        fill="none" stroke="#4A4A4A" stroke-width="3" opacity="0.6" stroke-linecap="round"/>

  <!-- Soft specular highlight -->
  <ellipse cx="140" cy="96" rx="22" ry="4" fill="#666666" opacity="0.3"/>

  <!-- Bottom shadow edge -->
  <path d="M90 120 L310 120" fill="none" stroke="#000000" stroke-width="1.8" opacity="0.6" stroke-linecap="round"/>
  
  <!-- Subtle speckles for a charred/baked texture -->
  <g fill="#333333" opacity="0.4">
    <circle cx="110" cy="105" r="1.5"/>
    <circle cx="145" cy="112" r="1.2"/>
    <circle cx="180" cy="100" r="1.8"/>
    <circle cx="220" cy="108" r="1.4"/>
    <circle cx="260" cy="102" r="1.6"/>
    <circle cx="295" cy="115" r="1.2"/>
    <circle cx="130" cy="118" r="1.5"/>
    <circle cx="240" cy="116" r="1.3"/>
    <circle cx="200" cy="115" r="1.7"/>
    <circle cx="270" cy="110" r="1.4"/>
  </g>
</svg>