<svg xmlns="http://www.w3.org/2000/svg" viewBox="58 68 284 74" preserveAspectRatio="none">
  <!-- Burger patty - rectangular shape -->
  <path d="M60 80
           Q60 70 80 70
           L320 70
           Q340 70 340 80
           L340 130
           Q340 140 320 140
           L80 140
           Q60 140 60 130
           Z"
        fill="#6D4C41" stroke="#4E342E" stroke-width="2"/>

  <!-- Patty highlight -->
  <path d="M90 95 L310 95" fill="none" stroke="#8A6A55" stroke-width="2"/>

  <!-- Criss-cross grill marks -->
  <g stroke="#5A4230" stroke-width="2" stroke-linecap="round">
    <!-- Diagonal down-right -->
    <line x1="85" y1="80" x2="135" y2="132"/>
    <line x1="115" y1="80" x2="165" y2="132"/>
    <line x1="145" y1="80" x2="195" y2="132"/>
    <line x1="175" y1="80" x2="225" y2="132"/>
    <line x1="205" y1="80" x2="255" y2="132"/>
    <line x1="235" y1="80" x2="285" y2="132"/>
    <line x1="265" y1="80" x2="315" y2="132"/>
    <!-- Diagonal down-left -->
    <line x1="315" y1="80" x2="265" y2="132"/>
    <line x1="285" y1="80" x2="235" y2="132"/>
    <line x1="255" y1="80" x2="205" y2="132"/>
    <line x1="225" y1="80" x2="175" y2="132"/>
    <line x1="195" y1="80" x2="145" y2="132"/>
    <line x1="165" y1="80" x2="115" y2="132"/>
    <line x1="135" y1="80" x2="85" y2="132"/>
  </g>

  <!-- Top edge detail -->
  <path d="M80 75 L320 75" fill="none" stroke="#5A4230" stroke-width="1"/>

  <!-- Bottom edge detail -->
  <path d="M80 135 L320 135" fill="none" stroke="#5A4230" stroke-width="1"/>
</svg>